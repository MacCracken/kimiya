[package]
name = "kimiya"
version = "1.2.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
description = "Kimiya — chemistry engine for elements, molecules, reactions, kinetics, and thermochemistry"
homepage = "https://github.com/MacCracken/kimiya"
repository = "https://github.com/MacCracken/kimiya"
readme = "README.md"
documentation = "https://docs.rs/kimiya"
keywords = ["chemistry", "elements", "reactions", "molecular", "thermochemistry"]
categories = ["science", "simulation"]
exclude = [".claude/", ".github/", "docs/", "scripts/"]

[features]
default = []
logging = ["dep:tracing-subscriber"]
soorat-compat = []

[dependencies]
hisab = { version = "1.4", default-features = false, features = ["num", "autodiff"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"], optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1.0.154"

[[bench]]
name = "benchmarks"
harness = false
